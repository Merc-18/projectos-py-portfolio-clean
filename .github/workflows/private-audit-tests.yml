name: Private audit validation
on:
  push:
    branches:
      - audit/historical-equivalence-2026-10-29
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-tickets.txt -r proyectos/historicos/requirements.txt reportlab beautifulsoup4 requests matplotlib pdfplumber scipy pytest
      - name: Compile Python sources
        run: python -m compileall -q proyectos tests
      - name: Run complete portfolio unit test suite
        run: python -m pytest -q tests proyectos --disable-warnings
